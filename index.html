  function nutStyle(){ return "background:#141414;color:#f5c518;border:0;border-radius:8px;padding:8px 12px;font:700 13px system-ui;flex:none"; }

  function moiCai(){
    if(document.getElementById("caiBar")) return;
    thanh("Cài vào màn hình chính để mở nhanh, dùng được cả khi mạng yếu.",
          '<button id="caiGo" style="' + nutStyle() + '">Cài đặt</button>');
    document.getElementById("caiGo").onclick = function(){
      if(!dp) return;
      dp.prompt();
      dp.userChoice.then(function(){ dp = null; var b=document.getElementById("caiBar"); if(b) b.remove(); });
    };
  }

  function chanDoan(){
    var t = [];
    t.push((location.protocol === "https:" ? "✔" : "✘") + " Mở bằng địa chỉ https");
    var l = document.getElementById("mfLink");
    t.push((l && l.href ? "✔" : "✘") + " Manifest đã gắn");
    t.push((daCai() ? "✔ Máy báo ĐÃ CÀI rồi — tìm icon trên màn hình chính, hoặc gỡ ra cài lại" : "· Chưa cài"));
    if(iOS) t.push("· iPhone: bấm nút Chia sẻ rồi chọn Thêm vào MH chính");
    var xong = function(){
      alert("Kiểm tra cài đặt:\n\n" + t.join("\n")
        + "\n\nNếu tất cả đều ✔ mà vẫn không có nút cài: tải lại trang thêm 1 lần (Chrome cần lần thứ hai),"
        + " hoặc vào Chrome ⋮ > Cài đặt ứng dụng.");
    };
    if(navigator.serviceWorker){
      navigator.serviceWorker.getRegistration().then(function(r){
        t.splice(2, 0, (r ? "✔" : "✘") + " Service worker đã chạy" + (r ? "" : " (thiếu file sw.js trong kho)"));
        xong();
      }).catch(xong);
    } else { t.splice(2,0,"✘ Trình duyệt không hỗ trợ service worker"); xong(); }
  }

  window.addEventListener("beforeinstallprompt", function(e){
    e.preventDefault(); dp = e;
    if(!daCai()) setTimeout(moiCai, 800);
  });
  window.addEventListener("appinstalled", function(){
    dp = null; var b = document.getElementById("caiBar"); if(b) b.remove();
  });
  document.addEventListener("DOMContentLoaded", function(){
    setTimeout(function(){
      if(dp || daCai() || document.getElementById("caiBar")) return;
      thanh(iOS ? "Trên iPhone: bấm nút <b>Chia sẻ</b> rồi chọn <b>Thêm vào MH chính</b>."
                : "Chưa cài được vào màn hình chính?",
            '<button id="caiHoi" style="' + nutStyle() + '">Kiểm tra</button>');
      document.getElementById("caiHoi").onclick = chanDoan;
    }, 4000);
  });
})();</script>
<style>
:root{
  --nhua:#12151a; --than:#191d24; --panel:#20252e; --vach:#2c333d;
  --son:#e9ecf1; --mo:#8b95a5; --mo2:#5d6673;
  --bien:#f5c518; --bien-d:#c99f0a;
  --canh:#ff4d4f; --chay:#3ddc97; --xanh:#4aa8ff; --tim:#b085f5;
  --r:10px; --sp:12px;
  --fdisp:'Roboto Condensed','Arial Narrow',ui-sans-serif,system-ui,sans-serif;
  --fbody:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fnum:ui-monospace,'Roboto Mono',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--nhua);color:var(--son);font-family:var(--fbody);
  font-size:15px;line-height:1.45;overscroll-behavior-y:none;
  padding-bottom:calc(62px + env(safe-area-inset-bottom));
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--bien);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- BIỂN SỐ: chi tiết chữ ký của app ---------- */
.plate{
  display:inline-flex;align-items:center;justify-content:center;
  background:linear-gradient(#ffdc4a,#efbe0b);color:#101010;
  font-family:var(--fdisp);font-weight:700;font-size:14px;letter-spacing:.6px;
  padding:3px 8px;border-radius:5px;border:1.5px solid #101010;
  box-shadow:inset 0 -2px 0 rgba(0,0,0,.18);white-space:nowrap;text-transform:uppercase;
}
.plate.sm{font-size:12px;padding:1px 6px;border-width:1px}
.plate.lg{font-size:19px;padding:5px 11px}

/* ---------- TOPBAR ---------- */
.topbar{
  position:sticky;top:0;z-index:40;background:rgba(18,21,26,.94);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--vach);
  padding:calc(8px + env(safe-area-inset-top)) 12px 8px;
  display:flex;align-items:center;gap:10px;
}
.topbar h1{font-family:var(--fdisp);font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;flex:1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .sub{display:block;font-family:var(--fbody);font-size:11px;color:var(--mo);font-weight:400;letter-spacing:0}
.sync{
  border:1px solid var(--vach);background:var(--than);color:var(--mo);
  border-radius:20px;padding:5px 11px;font-size:12px;display:flex;align-items:center;gap:6px;cursor:pointer
}
.sync.dirty{border-color:var(--bien);color:var(--bien)}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--chay)}
.sync.dirty .dot{background:var(--bien);animation:pulse 1.4s infinite}
.sync.off .dot{background:var(--canh)}
@keyframes pulse{50%{opacity:.25}}

/* ---------- NAV ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:grid;grid-template-columns:repeat(5,1fr);
  background:rgba(25,29,36,.97);backdrop-filter:blur(10px);border-top:1px solid var(--vach);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;
  color:var(--mo2);font-size:10.5px;cursor:pointer;position:relative
}
.nav button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav button.on{color:var(--bien)}
.nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--bien);border-radius:0 0 3px 3px}
.nav .badge{position:absolute;top:4px;right:calc(50% - 20px);background:var(--canh);color:#fff;
  font-size:9px;font-weight:700;min-width:15px;height:15px;border-radius:8px;display:grid;place-items:center;padding:0 3px}

/* ---------- LAYOUT ---------- */
.view{display:none;padding:12px 12px 20px}
.view.on{display:block;animation:fade .18s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}}
.card{background:var(--than);border:1px solid var(--vach);border-radius:var(--r);padding:12px;margin-bottom:10px}
.card.tap{cursor:pointer}
.card.tap:active{background:var(--panel)}
.hd{display:flex;align-items:center;gap:8px;margin:16px 0 8px}
.hd:first-child{margin-top:2px}
.hd h2{font-family:var(--fdisp);font-size:13px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mo);margin:0;font-weight:700}
.hd .line{flex:1;height:1px;background:var(--vach)}
.hd a,.hd .act{font-size:12px;color:var(--bien);text-decoration:none;cursor:pointer}
.mo{color:var(--mo)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.num{font-family:var(--fnum);font-variant-numeric:tabular-nums}
.rowf{display:flex;align-items:center;gap:8px}
.rowf .grow{flex:1;min-width:0}
.trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{text-align:center;padding:34px 16px;color:var(--mo2)}
.empty b{display:block;color:var(--mo);font-size:14px;margin-bottom:4px;font-weight:600}

/* ---------- CHIP / BUTTON ---------- */
.chip{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;border:1px solid var(--vach);color:var(--mo);white-space:nowrap}
.chip.ok{color:var(--chay);border-color:rgba(61,220,151,.4);background:rgba(61,220,151,.09)}
.chip.warn{color:var(--bien);border-color:rgba(245,197,24,.4);background:rgba(245,197,24,.09)}
.chip.bad{color:var(--canh);border-color:rgba(255,77,79,.4);background:rgba(255,77,79,.1)}
.chip.run{color:var(--xanh);border-color:rgba(74,168,255,.4);background:rgba(74,168,255,.1)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--panel);border:1px solid var(--vach);color:var(--son);
  border-radius:9px;padding:10px 14px;font-size:14px;cursor:pointer;font-weight:500
}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--bien);border-color:var(--bien);color:#141414;font-weight:700}
.btn.dan{color:var(--canh);border-color:rgba(255,77,79,.45)}
.btn.blk{width:100%}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:7px}
.btns{display:flex;gap:8px}.btns>*{flex:1}
.fab{
  position:fixed;right:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:45;
  width:52px;height:52px;border-radius:50%;background:var(--bien);color:#141414;border:0;
  font-size:28px;line-height:1;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.5);display:none;place-items:center
}
.fab.on{display:grid}

/* ---------- NÚT HOTLINE NỔI (giống app Sổ Nợ · Bán Hàng) ---------- */
#hotlineFab{
  position:fixed;left:14px;bottom:calc(72px + env(safe-area-inset-bottom));z-index:45;
  display:none;align-items:center;gap:6px;background:#16a34a;color:#fff;text-decoration:none;
  padding:11px 16px;border-radius:30px;font-weight:800;font-size:13.5px;font-family:inherit;
  white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.45)
}
#hotlineFab.on{display:inline-flex}
#hotlineFab:active{transform:scale(.96)}

/* ---------- FORM ---------- */
.f{margin-bottom:11px}
.f label{display:block;font-size:11.5px;color:var(--mo);margin-bottom:4px;letter-spacing:.2px}
.f label .req{color:var(--canh)}
.f input,.f select,.f textarea{
  width:100%;background:var(--nhua);border:1px solid var(--vach);border-radius:8px;
  padding:10px 11px;font-size:15px;color:var(--son)
}
.f textarea{min-height:64px;resize:vertical}
.f input::placeholder{color:var(--mo2)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.f .hint{font-size:11px;color:var(--mo2);margin-top:3px}
.f.err input,.f.err select{border-color:var(--canh)}

/* ---------- SHEET / MODAL ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:60;display:none}
.mask.on{display:block}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--than);
  border-radius:16px 16px 0 0;border-top:1px solid var(--vach);
  max-height:92vh;display:none;flex-direction:column;transform:translateY(100%)
}
.sheet.on{display:flex;animation:up .22s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes up{to{transform:translateY(0)}}
.sheet-h{padding:14px 14px 10px;border-bottom:1px solid var(--vach);display:flex;align-items:center;gap:10px}
.sheet-h h3{margin:0;font-family:var(--fdisp);font-size:17px;flex:1;font-weight:700}
.sheet-h .x{background:none;border:0;color:var(--mo);font-size:26px;line-height:1;cursor:pointer;padding:0 4px}
.sheet-b{padding:14px;overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-f{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--vach);display:flex;gap:8px}
.sheet-f>*{flex:1}

/* ---------- LỊCH ĐIỀU XE (làn đường) ---------- */
.lich-wrap{border:1px solid var(--vach);border-radius:var(--r);overflow:hidden;background:var(--than)}
.lich-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.lich{min-width:640px}
.lich-head{display:flex;background:var(--panel);border-bottom:1px solid var(--vach);position:sticky;top:0;z-index:2}
.lich-head .cell,.lane .cell{flex:1 0 84px;padding:6px 4px;text-align:center;font-size:11px;border-left:1px solid var(--vach)}
.lich-head .cell b{display:block;font-family:var(--fdisp);font-size:15px}
.lich-head .cell.today{background:rgba(245,197,24,.13);color:var(--bien)}
.lich-head .fix,.lane .fix{
  flex:0 0 108px;position:sticky;left:0;z-index:3;background:var(--panel);
  padding:6px 8px;border-right:1px solid var(--vach);display:flex;align-items:center
}
.lane{display:flex;border-bottom:1px solid var(--vach);min-height:52px;position:relative}
.lane:last-child{border-bottom:0}
.lane .fix{background:var(--than);flex-direction:column;align-items:flex-start;justify-content:center;gap:2px}
.lane .cell{border-left:1px dashed var(--vach);padding:4px 3px;display:flex;flex-direction:column;gap:3px;justify-content:center}
.blk{
  background:rgba(74,168,255,.16);border-left:3px solid var(--xanh);border-radius:4px;
  padding:3px 5px;font-size:10.5px;line-height:1.25;cursor:pointer;text-align:left;overflow:hidden
}
.blk b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk.done{background:rgba(61,220,151,.13);border-color:var(--chay)}
.blk.cancel{background:rgba(139,149,165,.12);border-color:var(--mo2);text-decoration:line-through;opacity:.65}
.blk.clash{background:repeating-linear-gradient(45deg,rgba(255,77,79,.22) 0 6px,rgba(255,77,79,.08) 6px 12px);border-color:var(--canh)}
.lane .fix .stt{width:7px;height:7px;border-radius:50%;background:var(--chay);position:absolute;left:4px;top:6px}
.lich-legend{display:flex;gap:12px;flex-wrap:wrap;padding:8px 10px;font-size:11px;color:var(--mo);border-top:1px solid var(--vach)}
.lich-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}

/* ---------- LIST ITEM ---------- */
.item{display:flex;gap:10px;padding:11px 0;border-bottom:1px solid var(--vach);cursor:pointer}
.item:last-child{border-bottom:0}
.item .l{flex:1;min-width:0}
.item .r{text-align:right;flex-shrink:0}
.item .t{font-weight:600;font-size:14.5px}
.item .d{font-size:12px;color:var(--mo);margin-top:2px}
.money{font-family:var(--fnum);font-weight:700;font-size:14.5px}
.money.in{color:var(--chay)}.money.out{color:var(--canh)}

/* ---------- ALERT BANNER ---------- */
.alert{display:flex;gap:9px;align-items:flex-start;background:rgba(255,77,79,.09);border:1px solid rgba(255,77,79,.32);
  border-radius:var(--r);padding:10px 11px;margin-bottom:10px;font-size:13px}
.alert.warn{background:rgba(245,197,24,.08);border-color:rgba(245,197,24,.32)}
.alert b{display:block;margin-bottom:2px}
.alert .ic{font-size:15px;line-height:1.2}

/* ---------- TOAST ---------- */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(78px + env(safe-area-inset-bottom));
  background:var(--panel);border:1px solid var(--vach);color:var(--son);padding:10px 16px;border-radius:22px;
  font-size:13.5px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.on{opacity:1}
#toast.bad{border-color:var(--canh);color:#ffd7d7}

/* ---------- GATE (đăng nhập / hết hạn) ---------- */
#gate{position:fixed;inset:0;background:var(--nhua);z-index:100;display:none;overflow:auto}
#gate.on{display:block}
.gate-in{max-width:400px;margin:0 auto;padding:44px 22px}
.gate-logo{text-align:center;margin-bottom:26px}
.gate-logo .plate{font-size:22px;padding:7px 14px}
.gate-logo p{color:var(--mo);font-size:12.5px;margin:12px 0 0;letter-spacing:2.6px;text-transform:uppercase;font-family:var(--fdisp)}
.tabs{display:flex;background:var(--than);border:1px solid var(--vach);border-radius:9px;padding:3px;margin-bottom:16px}
.tabs button{flex:1;background:none;border:0;padding:8px;border-radius:7px;color:var(--mo);font-size:13.5px;cursor:pointer}
.tabs button.on{background:var(--bien);color:#141414;font-weight:700}
.qr-box{background:#fff;border-radius:10px;padding:10px;text-align:center;margin:10px 0}
.qr-box img{width:100%;max-width:250px;display:block;margin:0 auto}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--vach);font-size:13.5px}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--mo)}
.kv .v{text-align:right;font-weight:600;word-break:break-word}
.kv .v.copy{cursor:pointer;color:var(--bien)}

/* ---------- IN ẤN: hợp đồng + danh sách hành khách ---------- */
#print{display:none}
@media print{
  body{background:#fff;color:#000;padding:0;font-size:12pt}
  .topbar,.nav,.fab,#hotlineFab,.view,.sheet,.mask,#gate,#toast{display:none!important}
  #print{display:block;padding:0}
  .p-page{page-break-after:always;padding:10mm 8mm}
  .p-page:last-child{page-break-after:auto}
  .p-h{text-align:center;margin-bottom:10px}
  .p-h .qh{font-size:11pt;font-weight:700}
  .p-h .dl{font-size:11pt;border-bottom:1px solid #000;display:inline-block;padding-bottom:2px}
  .p-t{text-align:center;font-size:15pt;font-weight:700;margin:14px 0 2px}
  .p-s{text-align:center;font-size:10pt;margin-bottom:12px}
  .p-b{font-size:11.5pt;line-height:1.6}
  .p-b h4{margin:10px 0 4px;font-size:11.5pt}
  .p-b table{width:100%;border-collapse:collapse;margin:6px 0}
  .p-b td,.p-b th{border:1px solid #000;padding:4px 6px;font-size:10.5pt;text-align:left}
  .p-sign{display:flex;justify-content:space-between;margin-top:26px;text-align:center;font-size:11pt}
  .p-sign div{width:46%}
  .p-sign b{display:block}
  .p-sign span{display:block;color:#555;font-size:9.5pt;font-style:italic;margin-bottom:52px}
}
</style>
</head>
<body>

<!-- ============ CỔNG: đăng nhập / dùng thử / gia hạn ============ -->
<div id="gate" class="on"><div class="gate-in">
  <div class="gate-logo">

</div></div>

<!-- ============ APP ============ -->

<!-- 5. THU CHI -->

/* ==================================================================

   Kho riêng, chạy trên GitHub Pages, dùng chung Firebase với các app khác.

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, initializeAuth, indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword,
         sendPasswordResetEmail, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager,
         CACHE_SIZE_UNLIMITED, doc, getDoc, setDoc, collection, getDocs, writeBatch, deleteDoc, addDoc }
         from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

const CFG = {
  fb: {
    apiKey:"AIzaSyA_kjQ-CdASRkf50Glz3kQajlkD5qGWC4k",
    authDomain:"so-no-cc57a.firebaseapp.com",
    projectId:"so-no-cc57a",
    storageBucket:"so-no-cc57a.firebasestorage.app",
    messagingSenderId:"571694791559",
    appId:"1:571694791559:web:8e409728a520e2d370b122"
  },
  adminEmail:"cuahangminhtri1@gmail.com",
  hotline:"0977823979",   // số hỗ trợ hiện trên nút 📞 Hotline và các màn hình cổng
  thuThu:15,            // bằng TRIAL_DAYS của các app cũ
  giaMac:200000,        // chỉ dùng khi billing/info chưa đặt priceHd

};

/* Số hỗ trợ — dùng lại ở nút nổi 📞 Hotline và ở các màn hình cổng. */
const HOTLINE = (CFG.hotline||"").replace(/[^\d+]/g,"");
const soDep   = t => t.replace(/^(\d{4})(\d{3})(\d{3})$/, "$1 $2 $3");
const DONG_HOTRO = HOTLINE ? `<p class="xs mo" style="text-align:center;margin-top:16px">Cần hỗ trợ hoặc chỉnh sửa? `
  + `<a href="tel:${HOTLINE}" style="color:var(--bien);font-weight:800;text-decoration:none;white-space:nowrap">📞 Gọi ${soDep(HOTLINE)}</a></p>` : "";

/* Số tài khoản nhận tiền và bảng giá lấy từ doc billing/info — cùng chỗ với
   4 app cũ, sửa một lần trong bảng 👑 là cả hệ đổi theo. */
let BILL = {};
async function napBilling(){
  try{
    const s = await getDoc(doc(fdb,"billing","info"));
    if(s.exists()){ BILL = s.data(); try{ localStorage.setItem("billing_info", JSON.stringify(BILL)); }catch(e){} }

  }
}
const giaThang = () => num(BILL.priceHd) || num(BILL.pricePerMonth) || CFG.giaMac;
const bkBin = () => BILL.bin || BILL.bankBin || "";
const bkSo  = () => BILL.account || BILL.acc || "";
const bkTen = () => BILL.accName || "";

const fbApp = initializeApp(CFG.fb);
const auth  = initializeAuth(fbApp, { persistence: [indexedDBLocalPersistence, browserLocalPersistence, browserSessionPersistence] });
/* Bộ nhớ đệm ngoại tuyến ĐA TAB — giống app Sổ Nợ.
   enableIndexedDbPersistence (bản cũ) chỉ chạy được 1 tab: mở tab thứ hai là
   bộ đệm tắt im lặng, mất mạng là mất luôn dữ liệu. */
const fdb = (function(){
  let coIDB = false;
  try{ coIDB = (typeof indexedDB !== "undefined" && indexedDB !== null); }catch(e){}
  if(coIDB){
    try{
      return initializeFirestore(fbApp, { localCache: persistentLocalCache({
        tabManager: persistentMultipleTabManager(), cacheSizeBytes: CACHE_SIZE_UNLIMITED }) });
    }catch(e){ console.warn("cache:", e); }
  }
  return getFirestore(fbApp);
})();

/* ------------------------------ tiện ích ------------------------------ */
const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const num = v => { const n = Number(String(v??"").replace(/[^\d.-]/g,"")); return isFinite(n)?n:0; };
const tien = v => num(v).toLocaleString("vi-VN");
const hnay = () => new Date().toISOString().slice(0,10);
const ngayVN = s => s ? s.slice(0,10).split("-").reverse().join("/") : "";
const gioVN  = s => s && s.length>10 ? s.slice(11,16) : "";
const dt = s => s ? new Date(s.length>10 ? s : s+"T00:00") : null;
const themNgay = (s,n)=>{ const d=dt(s); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const cachNgay = (a,b)=> Math.round((dt(a)-dt(b))/864e5);
const THU = ["CN","T2","T3","T4","T5","T6","T7"];
const dToS = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const chuanNgay = v => !v ? "" : (typeof v==="string" ? v.slice(0,10) : dToS(v.toDate ? v.toDate() : new Date(v)));
const SO_NGAY_AN_HAN = 3;   // rules cho ân hạn 3 ngày sau khi hết hạn

let tId; function toast(m,bad){ const t=$("#toast"); t.textContent=m; t.className="on"+(bad?" bad":"");
  clearTimeout(tId); tId=setTimeout(()=>t.className="",2400); }

/* ------------------------------ STORE ------------------------------
   Nạp toàn bộ dữ liệu 1 lần, sửa trên RAM, ghi theo lô khi có thay đổi
   thật (so với bản chụp _shadow) → tiết kiệm lượt ghi Firestore.
   -------------------------------------------------------------------- */
const COLS = ["xe","tx","kh","hopdong","chuyen","chiphi","thuchi"];
const DB = {}; COLS.forEach(c=>DB[c]=[]);
let CH = {};                       // cấu hình đơn vị vận tải
let SH = {}, XOA = {}, UID = null, LIC = null;

const duong = c => `users/${UID}/${CFG.app}_${c}`;   // users/{uid}/hd_xe … khớp appCua() trong rules
const chup  = () => { SH={}; COLS.forEach(c=>{ SH[c]={}; DB[c].forEach(o=>SH[c][o.id]=JSON.stringify(o)); }); SH.__ch=JSON.stringify(CH); };
const khoaCache = () => `${CFG.app}_cache_${UID}`;

/* Bản sao trên máy — viết lại mỗi khi dữ liệu đổi, để mất mạng mở lại vẫn còn đủ.
   Bọc try/catch vì localStorage có thể đầy hoặc bị chặn ở chế độ riêng tư. */
function luuBanSao(){
  try{ localStorage.setItem(khoaCache(), JSON.stringify({DB,CH,t:Date.now()})); }catch(e){}
}
function docBanSao(){
  try{ const c = localStorage.getItem(khoaCache()); return c ? JSON.parse(c) : null; }catch(e){ return null; }
}
/* Tính lại "còn gì chưa lưu" từ ảnh chụp SH, thay cho việc xoá sạch cờ bằng tay
   (xoá sạch bằng tay là nguồn gốc của lỗi nuốt mất thay đổi). */
function tinhBan(){
  STORE.ban.clear();
  COLS.forEach(c=>{
    if((XOA[c]||[]).length || DB[c].some(o=>SH[c]?.[o.id] !== JSON.stringify(o))) STORE.ban.add(c);
  });
  if(JSON.stringify(CH) !== SH.__ch) STORE.ban.add("cauhinh");
}

const STORE = {
  ban:new Set(), dangGhi:false, hen:null, cho:false, henBS:null,

  async nap(){
    const banSao = docBanSao();
    try{
      const rs = await Promise.all(COLS.map(c=>getDocs(collection(fdb, duong(c)))));
      const tuCache = rs.some(r=>r.metadata && r.metadata.fromCache);
      const tong    = rs.reduce((t,r)=>t + r.size, 0);
      /* Mất mạng mà bộ đệm Firestore trống thì getDocs trả về RỖNG chứ không báo lỗi.
         Không chặn ở đây là app ghi đè bản sao trên máy bằng dữ liệu rỗng — mất sạch. */
      if(tuCache && tong === 0 && banSao) throw new Error("cache-rong");
      COLS.forEach((c,i)=>{ DB[c] = rs[i].docs.map(d=>({id:d.id, ...d.data()})); });
      try{
        const cd = await getDoc(doc(fdb, duong("cauhinh"), "main"));
        CH = cd.exists() ? cd.data() : {};
      }catch(e){ CH = (banSao && banSao.CH) || {}; }   // doc cấu hình chưa có trong đệm
      chup(); XOA={}; this.ban.clear();
      luuBanSao();
      if(tuCache) toast("Đang dùng dữ liệu lưu trên máy — chưa có mạng");
      return true;
    }catch(e){
      if(banSao){
        COLS.forEach(k=>DB[k] = banSao.DB[k] || []); CH = banSao.CH || {};
        chup(); XOA={}; this.ban.clear();
        toast("Đang dùng dữ liệu lưu trên máy — chưa có mạng");
        return true;
      }
      throw e;
    }
  },

  luu(c, o){                       // thêm mới hoặc cập nhật 1 bản ghi
    if(!o.id){ o.id = nid(); o.tao = new Date().toISOString(); DB[c].push(o); }
    else { const i = DB[c].findIndex(x=>x.id===o.id); i<0 ? DB[c].push(o) : DB[c][i]=o; }
    this.banRuc(c); return o;
  },
  xoa(c, id){
    DB[c] = DB[c].filter(x=>x.id!==id);
    (XOA[c] = XOA[c]||[]).push(id);
    this.banRuc(c);
  },
  banRuc(c){
    this.ban.add(c); capNhatNutLuu();
    clearTimeout(this.henBS); this.henBS = setTimeout(luuBanSao, 400);   // giữ bản sao luôn mới
  },

  async ghi(im){                   // ghi thật xuống Firestore
    if(this.dangGhi || !UID) return;
    const viec = [];                                   // gom việc cần ghi
    for(const c of COLS){
      for(const o of DB[c]){ const j=JSON.stringify(o); if(SH[c]?.[o.id]!==j) viec.push(["set",duong(c),o.id,o]); }
      for(const id of (XOA[c]||[])) viec.push(["del",duong(c),id]);
    }
    if(JSON.stringify(CH)!==SH.__ch) viec.push(["set",duong("cauhinh"),"main",CH]);
    const n = viec.length;
    if(!n){ tinhBan(); capNhatNutLuu(); return; }

    /* Chụp ĐÚNG trạng thái vừa đưa vào lô. Chờ xong mới chụp thì những sửa phát sinh
       trong lúc chờ sẽ bị đánh dấu nhầm là "đã lưu" và không bao giờ lên máy chủ. */
    const anh = {}; COLS.forEach(c=>{ anh[c]={}; DB[c].forEach(o=>anh[c][o.id]=JSON.stringify(o)); });
    anh.__ch = JSON.stringify(CH);
    const daGuiXoa = {}; COLS.forEach(c=>daGuiXoa[c] = [...(XOA[c]||[])]);

    this.dangGhi = true; capNhatNutLuu();
    try{
      const lo = [];
      for(let i=0;i<n;i+=400){                         // Firestore giới hạn 500 thao tác / lô
        const b = writeBatch(fdb);
        viec.slice(i,i+400).forEach(([kieu,d,id,o])=> kieu==="set" ? b.set(doc(fdb,d,id),o) : b.delete(doc(fdb,d,id)));
        lo.push(b.commit());
      }
      lo.forEach(p=>p.catch(()=>{}));                  // tránh cảnh báo promise treo
      /* Mất mạng thì commit() KHÔNG BAO GIỜ resolve — Firestore chỉ báo xong khi máy chủ nhận.
         Chờ mãi là nút kẹt "Đang lưu…" vĩnh viễn và mọi lần lưu sau đều bị chặn.
         Ghi đã nằm trong hàng đợi của Firestore rồi nên chỉ cần chờ có hạn. */
      const xong = await Promise.race([
        Promise.all(lo).then(()=>true, ()=>false),
        new Promise(r=>setTimeout(()=>r(null), 6000))
      ]);
      if(xong === false){                              // máy chủ từ chối: GIỮ NGUYÊN cờ để còn thử lại
        toast("Máy chủ từ chối ghi — kiểm tra hạn dùng rồi thử lại", 1);
        return;
      }
      SH = anh;
      COLS.forEach(c=>{ const g = new Set(daGuiXoa[c]); XOA[c] = (XOA[c]||[]).filter(id=>!g.has(id)); });
      tinhBan(); luuBanSao();
      if(xong === true){ this.cho = false; if(!im) toast("Đã lưu " + n + " thay đổi"); }
      else{                                            // hết giờ chờ = đang ngoại tuyến
        this.cho = true;
        Promise.all(lo).then(()=>{ this.cho = false; capNhatNutLuu(); }, ()=>{});
        if(!im) toast("Đã lưu vào máy — tự gửi lên khi có mạng");
      }
    }catch(e){ toast("Chưa lưu được — sẽ thử lại khi có mạng", 1); console.error(e); }
    finally{ this.dangGhi = false; capNhatNutLuu(); }
  },
  ghiMem(){ clearTimeout(this.hen); this.hen = setTimeout(()=>this.ghi(true), 1500); }  // không chặn giao diện
};
function capNhatNutLuu(){
  const b=$("#btnSync"), t=$("#syncTxt"); if(!b) return;
  if(STORE.dangGhi){ b.className="sync dirty"; t.textContent="Đang lưu…"; }
  else if(STORE.ban.size){ b.className="sync dirty"; t.textContent="Lưu ngay"; }
  else if(!navigator.onLine){ b.className="sync off"; t.textContent = STORE.cho ? "Chờ gửi" : "Ngoại tuyến"; }
  else if(STORE.cho){ b.className="sync dirty"; t.textContent="Đang gửi…"; }
  else { b.className="sync"; t.textContent="Đã lưu"; }
}
window.addEventListener("online", ()=>{ capNhatNutLuu(); STORE.ghi(true); });
window.addEventListener("offline", ()=>{ capNhatNutLuu(); toast("Mất mạng — vẫn ghi được, có mạng sẽ tự gửi lên"); });
window.addEventListener("beforeunload", e=>{ if(STORE.ban.size){ e.preventDefault(); e.returnValue=""; } });

/* ------------------------------ GIẤY PHÉP ------------------------------ */
const khoaLic = () => `${CFG.app}_lic_${UID}`;
/* Bản giấy phép lưu trên máy: chỉ để mở app khi mất mạng. Hạn dùng vẫn tính theo
   ngày ghi trong đó nên hết hạn là vẫn khoá — không lách được bằng cách tắt mạng. */
function ghiLicMay(l){ try{ localStorage.setItem(khoaLic(), JSON.stringify({ l, t: Date.now() })); }catch(e){} }
function docLicMay(){
  try{
    const o = JSON.parse(localStorage.getItem(khoaLic()) || "null");
    if(!o || !o.l) return null;
    if(Date.now() < (o.t||0) - 864e5) return null;    // đồng hồ máy bị vặn lùi → bắt nối mạng
    return o.l;
  }catch(e){ return null; }
}
async function docGiayPhep(){
  const r = doc(fdb, `accounts/${UID}/lic`, CFG.app);
  let s;
  try{ s = await getDoc(r); }
  catch(e){
    // Mất mạng và doc chưa nằm trong bộ đệm thì getDoc BÁO LỖI chứ không trả rỗng.
    const b = docLicMay(); if(b) return b;
    throw e;
  }
  if(s.exists()){
    const d = s.data();
    const l = { ...d, khoa: d.active === false,
             goi: d.goi || (d.trial ? "dùng thử" : "đã thanh toán"),
             hanDen: chuanNgay(d.paidUntil) };        // không có paidUntil = vĩnh viễn
    ghiLicMay(l);
    return l;
  }
  /* Chưa có giấy phép mà đang ngoại tuyến: setDoc sẽ treo mãi vì Firestore chờ máy chủ.
     Dừng sớm để app báo rõ thay vì đứng ở màn hình "Đang tải dữ liệu…". */
  if(!navigator.onLine || (s.metadata && s.metadata.fromCache)){
    const b = docLicMay(); if(b) return b;
    throw new Error("chua-co-giay-phep-offline");
  }
  // Tài khoản mới: tự cấp bản dùng thử, đúng khuôn quy tắc đang chạy
  // (trial + trialUsed + paidUntil kiểu timestamp, dưới 16 ngày, tạo đúng 1 lần).
  const d0 = new Date(); d0.setDate(d0.getDate() + CFG.thuThu); d0.setHours(23,59,0,0);
  await setDoc(r, { trial:true, trialUsed:true, active:true, paidUntil:d0, startedAt:new Date() });
  try{ await setDoc(doc(fdb,"accounts",UID), { email:auth.currentUser?.email||"", createdAt:new Date() }); }catch(e){}
  const l0 = { app:CFG.app, goi:"dùng thử", hanDen: dToS(d0) };
  ghiLicMay(l0);
  return l0;
}
const conHan = l => !!l && !l.khoa && (!l.hanDen || cachNgay(l.hanDen, hnay()) >= 0);

function congDangNhap(che){
  moCong(`
    <div class="tabs" id="tbAuth"><button class="on" data-m="in">Đăng nhập</button><button data-m="up">Tạo tài khoản</button></div>

function moSheet(t, b, f){ $("#shT").textContent=t; $("#shB").innerHTML=b; $("#shF").innerHTML=f||"";
  $("#mask").classList.add("on"); $("#sheet").classList.add("on"); }
function dongSheet(){ $("#mask").classList.remove("on"); $("#sheet").classList.remove("on"); }
$("#mask").onclick = dongSheet; $("#shX").onclick = dongSheet;
const val = id => ($("#"+id)?.value ?? "").trim();
const tenXe = id => DB.xe.find(x=>x.id===id)?.bienSo || "";
const tenTX = id => DB.tx.find(x=>x.id===id)?.ten || "—";
const tenKH = id => DB.kh.find(x=>x.id===id)?.ten || "—";
const bien = (b,c)=> b ? `<span class="plate ${c||''}">${esc(b)}</span>` : `<span class="chip">chưa gán xe</span>`;
const TT = { kh:["Đã lên lịch","run"], chay:["Đang chạy","warn"], xong:["Hoàn thành","ok"], huy:["Đã hủy",""] };
const LOAI_HD = {chuyen:"Thuê chuyến", thang:"Hợp đồng tháng", dua:"Đưa đón CB-CNV / học sinh", dulich:"Du lịch", cuoi:"Đám cưới", tang:"Đám tang"};
const opt = (o,v)=> Object.entries(o).map(([k,t])=>`<option value="${k}"${k===v?" selected":""}>${esc(t)}</option>`).join("");
const optDS = (ds,v,f)=> `<option value="">— chọn —</option>` + ds.map(o=>`<option value="${o.id}"${o.id===v?" selected":""}>${esc(f(o))}</option>`).join("");

/* =================== CẢNH BÁO GIẤY TỜ =================== */
function hetHan(){
  const r=[], h=hnay();
  DB.xe.filter(x=>!x.ngung).forEach(x=>[["dangKiem","đăng kiểm"],["baoHiem","bảo hiểm"],["phuHieu","phù hiệu XE HỢP ĐỒNG"]]
    .forEach(([k,t])=>{ if(x[k]){ const c=cachNgay(x[k],h); if(c<=15) r.push({c, m:`${x.bienSo}: ${t} ${c<0?`đã hết hạn ${-c} ngày`:`còn ${c} ngày`}`}); } }));
  DB.tx.filter(t=>!t.ngung).forEach(t=>[["hanGPLX","giấy phép lái xe"],["hanSK","giấy khám sức khỏe"]]
    .forEach(([k,n])=>{ if(t[k]){ const c=cachNgay(t[k],h); if(c<=15) r.push({c, m:`${t.ten}: ${n} ${c<0?`đã hết hạn ${-c} ngày`:`còn ${c} ngày`}`}); } }));
  return r.sort((a,b)=>a.c-b.c);
}
function veCanhBao(){
  const ds = hetHan(), n = ds.filter(x=>x.c<0).length;
  $("#canhBao").innerHTML = !ds.length ? "" :
    `<div class="alert ${n?'':'warn'}"><span class="ic">${n?'⛔':'⚠️'}</span><div><b>${n?`${n} giấy tờ đã hết hạn`:"Giấy tờ sắp hết hạn"}</b>
      ${ds.slice(0,4).map(x=>`<div class="sm">${esc(x.m)}</div>`).join("")}
      ${ds.length>4?`<div class="xs mo">…và ${ds.length-4} mục khác</div>`:""}</div></div>`;
  const b = $('.nav button[data-v="xe"]'); b.querySelector(".badge")?.remove();
  if(n) b.insertAdjacentHTML("beforeend", `<span class="badge">${n}</span>`);
}

/* =================== 1. LỊCH ĐIỀU XE =================== */
let mocLich = 0;
function trungLich(c){
  if(!c.xeId || c.trangThai==="huy") return false;
  return DB.chuyen.some(k=> k.id!==c.id && k.xeId===c.xeId && k.trangThai!=="huy"
      && dt(k.batDau) < dt(c.ketThuc||c.batDau) && dt(c.batDau) < dt(k.ketThuc||k.batDau));
}
function veLich(){
  const d0 = new Date(); d0.setDate(d0.getDate()+mocLich*7); d0.setHours(0,0,0,0);
  const ngay = [...Array(7)].map((_,i)=>{ const d=new Date(d0); d.setDate(d.getDate()+i); return d.toISOString().slice(0,10); });
  const xe = DB.xe.filter(x=>!x.ngung);
  let h = `<div class="lich-head"><div class="fix"><span class="xs mo">${ngayVN(ngay[0]).slice(0,5)} – ${ngayVN(ngay[6]).slice(0,5)}</span></div>`;
  ngay.forEach(n=>{ const d=dt(n); h+=`<div class="cell${n===hnay()?" today":""}"><b>${d.getDate()}</b>${THU[d.getDay()]}</div>`; });
  h += `</div>`;
  if(!xe.length) h += `<div class="empty"><b>Chưa có xe nào</b>Thêm xe ở tab “Xe &amp; TX” để bắt đầu xếp lịch.</div>`;
  xe.forEach(x=>{
    h += `<div class="lane"><div class="fix">${bien(x.bienSo,"sm")}<span class="xs mo">${x.soCho||"?"} chỗ</span></div>`;
    ngay.forEach(n=>{
      const ds = DB.chuyen.filter(c=>c.xeId===x.id && (c.batDau||"").slice(0,10)===n);
      h += `<div class="cell">` + ds.map(c=>{
        const k = c.trangThai==="xong"?"done":c.trangThai==="huy"?"cancel":trungLich(c)?"clash":"";
        return `<div class="blk ${k}" data-ct="${c.id}"><b>${gioVN(c.batDau)} ${esc(c.diemCuoi||c.lotrinh||"")}</b>${esc(tenTX(c.txId).split(" ").pop())}</div>`;
      }).join("") + `</div>`;
    });
    h += `</div>`;
  });
  $("#lichBody").innerHTML = h;
  $$("#lichBody .blk").forEach(b=>b.onclick=()=>xemChuyenNoiBo(b.dataset.ct));
}
function veHomNay(){
  const ds = DB.chuyen.filter(c=>(c.batDau||"").slice(0,10)===hnay() && c.trangThai!=="huy")
                      .sort((a,b)=>(a.batDau||"").localeCompare(b.batDau));
  $("#homNay").innerHTML = ds.length ? ds.map(c=>{
    const t = TT[c.trangThai]||TT.kh;
    return `<div class="item" data-ct="${c.id}"><div class="l">
      <div class="t">${gioVN(c.batDau)} · ${esc(c.diemDau||"")} → ${esc(c.diemCuoi||"")}</div>
      <div class="d">${esc(tenTX(c.txId))} · ${(c.hanhKhach||[]).length} khách${trungLich(c)?' · <span style="color:var(--canh)">trùng xe</span>':""}</div>
    </div><div class="r">${bien(tenXe(c.xeId),"sm")}<div style="margin-top:5px"><span class="chip ${t[1]}">${t[0]}</span></div></div></div>`;
  }).join("") : `<div class="empty"><b>Hôm nay không có chuyến</b>Tạo hợp đồng mới hoặc xếp chuyến từ nút +.</div>`;
  $$("#homNay .item").forEach(b=>b.onclick=()=>xemChuyenNoiBo(b.dataset.ct));
}

/* =================== 2. HỢP ĐỒNG =================== */
function veHD(){
  const q = ($("#timHD").value||"").toLowerCase();
  const ds = DB.hopdong.filter(h=> !q || [h.ma,tenKH(h.khId),tenXe(h.xeId),h.diemCuoi].join(" ").toLowerCase().includes(q))
                       .sort((a,b)=>(b.batDau||"").localeCompare(a.batDau||""));
  $("#dsHD").innerHTML = ds.length ? ds.map(h=>`
    <div class="item" data-hd="${h.id}"><div class="l">
      <div class="t">${esc(h.ma||"HĐ")} · ${esc(tenKH(h.khId))}</div>
      <div class="d">${ngayVN(h.batDau)} → ${ngayVN(h.ketThuc)} · ${esc(h.diemDau||"")} → ${esc(h.diemCuoi||"")}</div>
      <div class="d">${esc(LOAI_HD[h.loai]||"")} · ${h.soKhach||0} khách · ${h.cuLy||0} km</div>
    </div><div class="r"><div class="money">${tien(h.giaTri)}</div>
      <div style="margin-top:5px">${bien(tenXe(h.xeId),"sm")}</div></div></div>`).join("")
    : `<div class="empty"><b>Chưa có hợp đồng</b>Bấm + để lập hợp đồng đầu tiên.</div>`;
  $$("#dsHD .item").forEach(b=>b.onclick=()=>formHD(DB.hopdong.find(x=>x.id===b.dataset.hd)));

  `, `

  $("#themKH").onclick = ()=>{ const tam = docHD(m);          // giữ lại số liệu đang gõ dở

/* =================== 3. CHUYẾN =================== */
function veChuyen(){
  const l = $("#locChuyen").value, h = hnay();
  let ds = DB.chuyen.slice();
  if(l==="0") ds = ds.filter(c=>(c.batDau||"").slice(0,10)===h);
  else if(l!=="all"){ const n=num(l); ds = n>=0 ? ds.filter(c=>{const k=cachNgay(c.batDau,h); return k>=0&&k<=n;})
                                                : ds.filter(c=>{const k=cachNgay(c.batDau,h); return k<0&&k>=n;}); }
  ds.sort((a,b)=>(a.batDau||"").localeCompare(b.batDau||""));
  $("#dsChuyen").innerHTML = ds.length ? ds.map(c=>{
    const t=TT[c.trangThai]||TT.kh, hd=DB.hopdong.find(x=>x.id===c.hdId);
    return `<div class="item" data-ct="${c.id}"><div class="l">
      <div class="t">${ngayVN(c.batDau)} ${gioVN(c.batDau)} · ${esc(c.diemDau||"")} → ${esc(c.diemCuoi||"")}</div>
      <div class="d">${hd?esc(hd.ma)+" · ":""}${esc(tenKH(hd?.khId))}</div>
      <div class="d">${esc(tenTX(c.txId))} · ${(c.hanhKhach||[]).length} khách${trungLich(c)?' · <span style="color:var(--canh)">trùng xe</span>':""}</div>
    </div><div class="r">${bien(tenXe(c.xeId),"sm")}<div style="margin-top:5px"><span class="chip ${t[1]}">${t[0]}</span></div></div></div>`;
  }).join("") : `<div class="empty"><b>Không có chuyến nào</b>Đổi bộ lọc hoặc bấm + để xếp chuyến.</div>`;
  $$("#dsChuyen .item").forEach(b=>b.onclick=()=>xemChuyenNoiBo(b.dataset.ct));
}

      <div class="kv"><span class="k">Xe / tài xế</span><span class="v">${esc(tenXe(c.xeId)||"chưa gán xe")} · ${esc(tenTX(c.txId))}</span></div>
      <div class="kv"><span class="k">Doanh thu</span><span class="v num">${tien(c.doanhThu)} đ</span></div>

  const h = hnay();

    return `<span class="chip ${c<0?"bad":c<=15?"warn":"ok"}">${ngayVN(d)}</span>`; };
  if(tabXe==="xe"){
    $("#dsXe").innerHTML = DB.xe.length ? DB.xe.map(x=>`
      <div class="item" data-i="${x.id}"><div class="l">
        <div class="rowf">${bien(x.bienSo)}<span class="sm mo">${x.soCho||"?"} chỗ · ${esc(x.loai||"")}</span></div>
        <div class="d" style="margin-top:6px">Đăng kiểm ${han(x.dangKiem)} Bảo hiểm ${han(x.baoHiem)} Phù hiệu ${han(x.phuHieu)}</div>
      </div></div>`).join("") : `<div class="empty"><b>Chưa có xe</b>Bấm + để khai xe đầu tiên.</div>`;
    $$("#dsXe .item").forEach(b=>b.onclick=()=>formXe(DB.xe.find(x=>x.id===b.dataset.i)));
  } else if(tabXe==="tx"){
    $("#dsXe").innerHTML = DB.tx.length ? DB.tx.map(t=>`
      <div class="item" data-i="${t.id}"><div class="l">
        <div class="t">${esc(t.ten)} <span class="chip">${esc(t.hangGPLX||"?")}</span></div>
        <div class="d">${esc(t.sdt||"")}</div>
        <div class="d" style="margin-top:4px">GPLX ${han(t.hanGPLX)} Sức khỏe ${han(t.hanSK)}</div>
      </div></div>`).join("") : `<div class="empty"><b>Chưa có tài xế</b>Bấm + để thêm.</div>`;
    $$("#dsXe .item").forEach(b=>b.onclick=()=>formTX(DB.tx.find(x=>x.id===b.dataset.i)));
  } else {
    $("#dsXe").innerHTML = DB.kh.length ? DB.kh.map(k=>{
      const no = congNo(k.id);
      return `<div class="item" data-i="${k.id}"><div class="l">

/* =================== 5. THU CHI & BÁO CÁO =================== */
const trongThang = (d,t) => (d||"").slice(0,7)===t;
function congNo(khId){
  const hd = DB.hopdong.filter(h=>h.khId===khId && h.trangThai!=="huy").reduce((s,h)=>s+num(h.giaTri),0);
  const thu = DB.thuchi.filter(t=>t.loai==="thu" && t.khId===khId).reduce((s,t)=>s+num(t.soTien),0);
  return hd - thu;
}
function veTien(){
  const t = $("#thangBC").value || hnay().slice(0,7);
  const ct = DB.chuyen.filter(c=>trongThang(c.batDau,t) && c.trangThai!=="huy");
  const dt_ = ct.reduce((s,c)=>s+num(c.doanhThu),0);
  const cp = DB.chiphi.filter(x=>trongThang(x.ngay,t)).reduce((s,x)=>s+num(x.soTien),0)
           + DB.thuchi.filter(x=>x.loai==="chi" && trongThang(x.ngay,t)).reduce((s,x)=>s+num(x.soTien),0);
  $("#bcTong").innerHTML = `<div class="card"><div class="kv"><span class="k">Số chuyến</span><span class="v num">${ct.length}</span></div>
    <div class="kv"><span class="k">Doanh thu</span><span class="v num" style="color:var(--chay)">${tien(dt_)} đ</span></div>
    <div class="kv"><span class="k">Chi phí</span><span class="v num" style="color:var(--canh)">${tien(cp)} đ</span></div>

async function taoLinkTaiXe(c){
  const h = DB.hopdong.find(x=>x.id===c.hdId)||{}, k = DB.kh.find(x=>x.id===h.khId)||{}, x = DB.xe.find(x=>x.id===c.xeId)||{};
  const token = c.share || (nid()+nid());
  const goi = {
    dv:{ ten:CH.ten||"", sdt:CH.sdt||"", mst:CH.mst||"", diaChi:CH.diaChi||"", daiDien:CH.daiDien||"", khanCap:CH.khanCap||"" },
    hd:{ ma:h.ma||"", loai:LOAI_HD[h.loai]||"", ngayKy:h.ngayKy||"", batDau:c.batDau||"", ketThuc:c.ketThuc||"",
         diemDau:c.diemDau||h.diemDau||"", diemCuoi:c.diemCuoi||h.diemCuoi||"", diemDon:h.diemDon||[],
         cuLy:h.cuLy||0, soKhach:h.soKhach||(c.hanhKhach||[]).length },
    ben:{ ten:k.ten||"", cccd:k.cccd||"", diaChi:k.diaChi||"", sdt:k.sdt||"" },
    xe:{ bienSo:x.bienSo||"", soCho:x.soCho||"" },
    tx:{ ten:tenTX(c.txId) },
    hk:(c.hanhKhach||[]).map(p=>({ten:p.ten||"", sdt:p.sdt||""})),
    hetHan: themNgay((c.ketThuc||c.batDau||hnay()).slice(0,10), 3),
    xeId: c.xeId||"",
    ownerUid: UID
  };
  try{
    await setDoc(doc(fdb,"shares_"+CFG.app, token), goi);
    if(!c.share){ c.share = token; STORE.luu("chuyen",c); STORE.ghi(true); }
    const url = location.origin + location.pathname + "?ct=" + token;
    moSheet("Link tra cứu cho tài xế", `
      <p class="sm mo">Gửi link này cho tài xế qua Zalo. Mở được trên điện thoại, không cần đăng nhập —
      dùng để xuất trình hợp đồng và danh sách hành khách khi bị kiểm tra.</p>
      <div class="f"><input id="lk" value="${esc(url)}" readonly></div>
      <p class="xs mo">Link tự hết hiệu lực sau ngày ${ngayVN(goi.hetHan)}. Bấm lại nút này sau khi sửa danh sách hành khách để cập nhật.</p>

    $("#lkMo").onclick = ()=> window.open(url,"_blank");
  }catch(e){ console.error(e); toast("Chưa tạo được link — kiểm tra quy tắc Firestore",1); }
}

  + `</div>`
  + `<div id="gpsMap"></div><div id="gpsMapErr"></div><div id="gpsList"></div>`;
  document.body.appendChild(wrap);

  /* --------------------------- tiện ích nhỏ --------------------------- */
  function tuoi(at){
    if(!at) return "chưa rõ";
    const ms = Date.now() - new Date(at).getTime();
    if(ms < 60000) return "vừa xong";
    const ph = Math.floor(ms/60000); if(ph < 60) return ph + " phút trước";
    const h = Math.floor(ph/60);     if(h < 24) return h + " giờ trước";
    return Math.floor(h/24) + " ngày trước";
  }
  const bienCua = id => (dsXe.find(x=>x.id===id)||{}).bienSo || (dsVT.find(v=>v.id===id)||{}).bienSo || id;
  function msg(t, bad){ const m=gid("gpsMsg"); if(m){ m.textContent=t; m.style.color = bad ? "#ff6b6b" : "#8b95a5"; } }

  /* --------------------------- hiện/ẩn nút nổi --------------------------- */
  function syncFab(){
    const nav = gid("nav");
    const navHien = nav && getComputedStyle(nav).display !== "none";
    fab.classList.toggle("on", !!(uid && navHien));   // chỉ hiện khi đã đăng nhập & vào được app
  }

  /* --------------------------- nạp dữ liệu --------------------------- */
  async function taiXe(){
    if(!uid){ dsXe=[]; return; }
    try{
      const s = await getDocs(collection(db, duongXe(uid)));
      dsXe = s.docs.map(d=>({ id:d.id, bienSo:d.data()[F_BIEN]||"(chưa đặt biển)", ngung:!!d.data().ngung }));
    }catch(e){ /* mất mạng & chưa có cache → giữ danh sách cũ */ }
  }
  async function taiVT(){
    if(!uid){ dsVT=[]; return; }
    try{
      const s = await getDocs(collection(db, duongVT(uid)));
      dsVT = s.docs.map(d=>({ id:d.id, ...d.data() }));
    }catch(e){ /* giữ dữ liệu cũ */ }
  }

  /* --------------------------- vẽ bộ chọn xe --------------------------- */
  function veSel(){
    const sel = gid("gpsSel"); const luu = xeChia || localStorage.getItem(KEY_XE) || "";
    const ds = dsXe.filter(x=>!x.ngung);
    sel.innerHTML = `<option value="">— Chọn xe của bạn —</option>`
      + ds.map(x=>`<option value="${esc(x.id)}"${x.id===luu?" selected":""}>${esc(x.bienSo)}</option>`).join("");
    sel.disabled = (watchId!=null);
  }

  /* --------------------------- vẽ danh sách --------------------------- */
  function veList(){
    const box = gid("gpsList");
    const coVT  = dsVT.filter(v=>isFinite(v.lat)&&isFinite(v.lng))
                      .sort((a,b)=>String(b.at||"").localeCompare(String(a.at||"")));
    const idsVT = new Set(coVT.map(v=>v.id));
    const chua  = dsXe.filter(x=>!idsVT.has(x.id));
    if(!coVT.length && !chua.length){
      box.innerHTML = `<div class="empty">Chưa có xe nào.<br>Thêm xe trong mục “Xe &amp; TX”.</div>`; return;
    }
    let h = "";
    if(coVT.length){
      h += coVT.map(v=>{
        const old = (Date.now()-new Date(v.at||0).getTime()) > CU_MS;
        const sp  = (v.spd!=null && v.spd>=0) ? ` · ${Math.round(v.spd*3.6)} km/h` : "";
        return `<div class="r" data-id="${esc(v.id)}" data-lat="${v.lat}" data-lng="${v.lng}">`
             +   `<div class="in"><div class="t"><span class="pl">${esc(bienCua(v.id))}</span></div>`
             +   `<div class="sub ${old?"old":""}">Cập nhật ${tuoi(v.at)}${sp}</div></div>`
             +   `<button class="go">Chỉ đường</button></div>`;
      }).join("");
    }
    if(chua.length){
      h += `<h4>Chưa có vị trí</h4>`
        + chua.map(x=>`<div class="r"><div class="in"><div class="t"><span class="pl">${esc(x.bienSo)}</span></div>`
             + `<div class="sub">Chưa bật chia sẻ trên xe này</div></div></div>`).join("");
    }
    box.innerHTML = h;
    box.querySelectorAll(".r[data-lat]").forEach(r=>{
      const la=+r.dataset.lat, ln=+r.dataset.lng, id=r.dataset.id;
      r.onclick = ()=>{
        if(Lok && map){ map.setView([la,ln],16); if(mk[id]) mk[id].openPopup(); }
        else window.open(`https://www.google.com/maps?q=${la},${ln}`,"_blank");
      };
      const b = r.querySelector(".go");
      if(b) b.onclick = e=>{ e.stopPropagation(); window.open(`https://www.google.com/maps/dir/?api=1&destination=${la},${ln}`,"_blank"); };
    });
  }

  /* --------------------------- bản đồ (Leaflet, nạp lười) --------------------------- */
  function mapErr(t){ gid("gpsMap").classList.add("hide"); const e=gid("gpsMapErr"); e.textContent=t; e.classList.add("on"); }
  function initMap(){
    if(Lok){ setTimeout(()=>{ map.invalidateSize(); veMap(true); }, 60); return; }
    if(window.L){ dungMap(); return; }
    if(Ltried){ mapErr("Không tải được bản đồ (cần mạng). Dùng danh sách bên dưới & nút Chỉ đường."); return; }
    Ltried = true;
    if(!gid("gpsLeafCss")){
      const l=document.createElement("link"); l.id="gpsLeafCss"; l.rel="stylesheet";
      l.href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"; document.head.appendChild(l);
    }
    const s=document.createElement("script"); s.src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    let xong=false;
    const to=setTimeout(()=>{ if(!xong){ xong=true; mapErr("Bản đồ tải quá lâu (mạng yếu). Dùng danh sách & nút Chỉ đường."); } }, 9000);
    s.onload =()=>{ if(xong) return; xong=true; clearTimeout(to); dungMap(); };
    s.onerror=()=>{ if(xong) return; xong=true; clearTimeout(to); mapErr("Không tải được bản đồ (cần mạng). Dùng danh sách bên dưới & nút Chỉ đường."); };
    document.body.appendChild(s);
  }
  function dungMap(){
    try{
      gid("gpsMap").classList.remove("hide"); gid("gpsMapErr").classList.remove("on");
      map = L.map("gpsMap",{zoomControl:true}).setView([16.047,108.206],5);   // giữa Việt Nam
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);
      Lok = true;
      setTimeout(()=>map.invalidateSize(),60);
      setTimeout(()=>map.invalidateSize(),350);
      veMap(true);
    }catch(e){ mapErr("Bản đồ lỗi khởi tạo. Dùng danh sách bên dưới & nút Chỉ đường."); }
  }
  function veMap(fit){
    if(!Lok || !map) return;
    const pts=[];
    dsVT.forEach(v=>{
      if(!(isFinite(v.lat)&&isFinite(v.lng))) return;
      pts.push([v.lat,v.lng]);
      const html = `<b>${esc(bienCua(v.id))}</b><br>Cập nhật ${tuoi(v.at)}`
        + (v.spd!=null && v.spd>=0 ? `<br>${Math.round(v.spd*3.6)} km/h` : "")
        + `<br><a href="https://www.google.com/maps/dir/?api=1&destination=${v.lat},${v.lng}" target="_blank" rel="noopener">Chỉ đường ▸</a>`;
      if(mk[v.id]) mk[v.id].setLatLng([v.lat,v.lng]).setPopupContent(html);
      else mk[v.id] = L.marker([v.lat,v.lng]).addTo(map).bindPopup(html);
    });
    Object.keys(mk).forEach(id=>{ if(!dsVT.some(v=>v.id===id)){ map.removeLayer(mk[id]); delete mk[id]; } });
    if(fit && pts.length){ try{ map.fitBounds(pts,{padding:[40,40],maxZoom:15}); }catch(e){} }
  }

  /* --------------------------- mở / đóng bảng --------------------------- */
  async function moPanel(){
    document.body.style.overflow="hidden";
    wrap.classList.add("on");
    await taiXe(); veSel();
    veList();                 // vẽ khung ngay (dsVT có thể còn rỗng), listener sẽ cập nhật liền
    capUI();
    initMap();
    // Nghe vị trí THỜI GIAN THỰC: xe gửi là hiện ngay; đứng yên thì không tốn lượt đọc
    if(vtUnsub){ try{ vtUnsub(); }catch(e){} vtUnsub=null; }
    if(uid){
      try{
        vtUnsub = onSnapshot(collection(db, duongVT(uid)), snap=>{
          dsVT = snap.docs.map(d=>({ id:d.id, ...d.data() }));
          veList(); veMap();
        }, e=>{ /* lỗi mạng/quota: giữ nguyên dữ liệu đang có */ });
      }catch(e){ await taiVT(); veList(); veMap(); }   // dự phòng: đọc 1 lần
    }
  }
  function dongPanel(){
    wrap.classList.remove("on");
    document.body.style.overflow="";
    if(vtUnsub){ try{ vtUnsub(); }catch(e){} vtUnsub=null; }   // ngừng nghe → không đọc ở nền
    // KHÔNG tắt chia sẻ: đóng bảng vẫn tiếp tục gửi vị trí ở nền (khi app còn mở)
  }

  /* --------------------------- chia sẻ vị trí --------------------------- */
  function capUI(){
    const on = watchId!=null, tog=gid("gpsTog"), sel=gid("gpsSel");
    tog.textContent = on ? "Dừng chia sẻ" : "Bật chia sẻ";
    tog.classList.toggle("stop", on);
    if(sel) sel.disabled = on;
    fab.classList.toggle("live", on);
    gid("gpsFabT").textContent = on ? "Đang gửi vị trí" : "🗺️ Vị trí xe";
  }
  function batChia(){
    const id = gid("gpsSel").value;
    if(!id) return msg("Hãy chọn xe bạn đang chạy.", true);
    if(!("geolocation" in navigator)) return msg("Thiết bị không hỗ trợ định vị.", true);
    if(!window.isSecureContext)       return msg("Cần mở qua HTTPS mới định vị được.", true);
    if(!uid)                          return msg("Bạn cần đăng nhập lại.", true);
    xeChia = id; gui = null; localStorage.setItem(KEY_XE, id);
    try{
      watchId = navigator.geolocation.watchPosition(onPos, onErr,
        { enableHighAccuracy:true, maximumAge:5000, timeout:20000 });
    }catch(e){ return msg("Không bật được định vị: " + (e.message||""), true); }
    capUI(); msg("Đang bật định vị… giữ app mở và bật màn hình.");
    giuMan();
  }
  function dungChia(){
    if(watchId!=null){ try{ navigator.geolocation.clearWatch(watchId); }catch(e){} }
    watchId=null; xeChia=null; gui=null; capUI(); thaMan();
    msg("Đã dừng chia sẻ vị trí.");
  }
  function onPos(p){
    const c = p.coords, now = Date.now();
    if(gui && (now - gui.t) < MIN_MS) return;   // giữ tối đa 1 lần ghi mỗi 20s (tiết kiệm lượt ghi)
    gui = { t: now };
    const bs = bienCua(xeChia);
    const rec = { xeId:xeChia, bienSo:bs, lat:c.latitude, lng:c.longitude,
      acc:(c.accuracy==null?null:c.accuracy), spd:(c.speed==null?null:c.speed),
      heading:(c.heading==null?null:c.heading), at:new Date().toISOString(),
      by:(auth.currentUser && auth.currentUser.email) || "" };
    setDoc(doc(db, duongVT(uid), xeChia), rec).catch(()=>{});   // offline: Firestore tự xếp hàng, có mạng gửi sau
    const i = dsVT.findIndex(v=>v.id===xeChia);                 // cập nhật ngay trên bảng cho mượt
    if(i<0) dsVT.push({ id:xeChia, ...rec }); else dsVT[i] = { id:xeChia, ...rec };
    veList(); veMap();
    msg(`Đang gửi vị trí xe ${bs} · sai số ±${Math.round(c.accuracy||0)}m`);
  }
  function onErr(e){
    if(e.code===1){ msg("Bạn đã từ chối quyền vị trí. Vào cài đặt trình duyệt để Cho phép rồi bật lại.", true); dungChia(); }
    else if(e.code===2) msg("Chưa bắt được GPS. Ra chỗ thoáng và bật Vị trí (Location) trên điện thoại.", true);
    else if(e.code===3) msg("Bắt GPS hơi lâu, đang thử lại…", true);
    else msg("Lỗi định vị: " + (e.message||""), true);
  }

  /* --------------------------- giữ màn hình sáng khi đang chia sẻ --------------------------- */
  async function giuMan(){ try{ if("wakeLock" in navigator) wake = await navigator.wakeLock.request("screen"); }catch(e){} }
  function thaMan(){ try{ if(wake && wake.release) wake.release(); }catch(e){} wake=null; }
  document.addEventListener("visibilitychange", ()=>{
    if(document.visibilityState==="visible" && watchId!=null && !wake) giuMan();
  });

  /* --------------------------- nối nút bấm --------------------------- */
  fab.onclick = moPanel;
  gid("gpsClose").onclick = dongPanel;
  gid("gpsTog").onclick   = ()=> (watchId!=null ? dungChia() : batChia());
  gid("gpsSel").onchange  = e=>{ if(e.target.value) localStorage.setItem(KEY_XE, e.target.value); };

  /* --------------------------- theo dõi đăng nhập --------------------------- */
  onAuthStateChanged(auth, u=>{
    uid = u ? u.uid : null;
    if(!u && watchId!=null) dungChia();   // đăng xuất thì tắt chia sẻ
    syncFab();
  });
  const navEl = gid("nav");
  if(navEl) new MutationObserver(syncFab).observe(navEl, { attributes:true, attributeFilter:["style"] });
  syncFab();

  /* =========================================================================
     CHẾ ĐỘ TÀI XẾ (trang ?ct=token): tài xế mở link, không đăng nhập, bấm 1 nút
     để gửi vị trí xe về nhà xe. Ghi thẳng vào users/{ownerUid}/hd_vitri/{xeId}
     kèm token — Firestore rules kiểm token khớp share doc mới cho ghi.
     ========================================================================= */
  async function driverShare(token){
    let g;
    try{ const s = await getDoc(doc(db, "shares_"+APP, token)); if(!s.exists()) return; g = s.data(); }
    catch(e){ return; }   // link sai/hết hạn: trang tra cứu đã tự báo lỗi, không chèn nút
    const owner = g.ownerUid, xeId = g.xeId, bien = (g.xe && g.xe.bienSo) || "", byTX = (g.tx && g.tx.ten) || "tài xế";
    const today  = new Date().toISOString().slice(0,10);

    const s2 = document.createElement("style"); s2.textContent = `
#gpsDrv{position:fixed;left:0;right:0;bottom:0;z-index:2147482900;background:#111826;border-top:1px solid #263042;padding:12px 14px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -6px 22px rgba(0,0,0,.45);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
#gpsDrv .dbtn{width:100%;background:#2563eb;border:0;border-radius:12px;padding:14px;color:#fff;font-weight:800;font-size:15px;cursor:pointer}
#gpsDrv .dbtn.on{background:#ff4d4f}
#gpsDrv .dmsg{margin:8px 4px 0;font-size:12px;color:#cbd5e1;text-align:center;line-height:1.45}
@media print{#gpsDrv{display:none!important}}`;
    document.head.appendChild(s2);

    const bar = document.createElement("div"); bar.id = "gpsDrv"; document.body.appendChild(bar);
    document.body.style.paddingBottom = "168px";   // chừa chỗ cho thanh cố định

    if(g.hetHan && g.hetHan < today){ bar.innerHTML = `<p class="dmsg">Link đã hết hiệu lực — không gửi được vị trí. Liên hệ nhà xe lấy link mới.</p>`; return; }
    if(!owner || !xeId){ bar.innerHTML = `<p class="dmsg">Nhà xe cần bấm lại “Link tài xế” một lần để bật định vị cho link này.</p>`; return; }

    bar.innerHTML = `<button class="dbtn" id="drvTog">📍 Chia sẻ vị trí xe ${esc(bien)}</button>`
      + `<p class="dmsg" id="drvMsg">Bật để gửi vị trí xe về nhà xe theo dõi. Giữ trang này mở và để màn hình sáng thì mới gửi liên tục.</p>`;

    let wid=null, moc=null, wl=null;
    const setMsg = (t,bad)=>{ const m=document.getElementById("drvMsg"); if(m){ m.textContent=t; m.style.color = bad?"#ff6b6b":"#cbd5e1"; } };
    const setBtn = on=>{ const b=document.getElementById("drvTog"); if(!b) return;
      b.textContent = on ? "■ Dừng chia sẻ vị trí" : ("📍 Chia sẻ vị trí xe " + bien); b.classList.toggle("on", on); };
    async function keepAwake(){ try{ if("wakeLock" in navigator) wl = await navigator.wakeLock.request("screen"); }catch(e){} }
    function relAwake(){ try{ if(wl && wl.release) wl.release(); }catch(e){} wl=null; }

    function start(){
      if(!("geolocation" in navigator)) return setMsg("Thiết bị không hỗ trợ định vị.", true);
      if(!window.isSecureContext)       return setMsg("Cần mở link qua HTTPS mới định vị được.", true);
      moc=null;
      try{ wid = navigator.geolocation.watchPosition(onP, onE, { enableHighAccuracy:true, maximumAge:5000, timeout:20000 }); }
      catch(e){ return setMsg("Không bật được định vị: " + (e.message||""), true); }
      setBtn(true); setMsg("Đang bật định vị… giữ trang mở & màn hình sáng."); keepAwake();
    }
    function stop(){
      if(wid!=null){ try{ navigator.geolocation.clearWatch(wid); }catch(e){} }
      wid=null; moc=null; relAwake(); setBtn(false); setMsg("Đã dừng chia sẻ vị trí.");
    }
    function onP(p){
      const c=p.coords, now=Date.now();
      if(moc && (now-moc) < MIN_MS) return;   // tối đa 1 lần ghi / 20s
      moc = now;
      const rec = { xeId:xeId, bienSo:bien, lat:c.latitude, lng:c.longitude,
        acc:(c.accuracy==null?null:c.accuracy), spd:(c.speed==null?null:c.speed),
        heading:(c.heading==null?null:c.heading), at:new Date().toISOString(), by:byTX, token:token };
      setDoc(doc(db, `users/${owner}/${APP}_${KHO_VT}`, xeId), rec).catch(()=>{});   // offline: Firestore xếp hàng gửi sau
      setMsg(`Đang gửi vị trí về nhà xe · sai số ±${Math.round(c.accuracy||0)}m`);
    }
    function onE(e){
      if(e.code===1){ setMsg("Bạn đã từ chối quyền vị trí. Vào cài đặt trình duyệt để Cho phép rồi bật lại.", true); stop(); }
      else if(e.code===2) setMsg("Chưa bắt được GPS. Ra chỗ thoáng và bật Vị trí (Location) trên điện thoại.", true);
      else if(e.code===3) setMsg("Bắt GPS hơi lâu, đang thử lại…", true);
      else setMsg("Lỗi định vị: " + (e.message||""), true);
    }
    document.getElementById("drvTog").onclick = ()=> (wid!=null ? stop() : start());
    document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && wid!=null && !wl) keepAwake(); });
  }
})();
</script>
<!-- ===== LINK ĐỊNH VỊ THEO XE · app hd · drop-in độc lập (nút 🔗 + trang ?vt=) ===== -->
<script type="module">
import { getApps, getApp, initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, deleteDoc, collection } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";
(function(){
  if (window.__HDLINK_READY__) return; window.__HDLINK_READY__ = true;

  const KHO_XE    = "hd_xe";        // kho xe:  users/{uid}/hd_xe
  const F_BIEN    = "bienSo";
  const KHO_SHARE = "shares_hd";    // dùng chung kho link tài xế của hd
  const KHO_VT    = "hd_vitri";     // kho vị trí (bản đồ chủ đã đọc)
  const MIN_MS    = 20000;
  const DAY = 86400000, HAN_NGAY = 60;

  const FB = { apiKey:"AIzaSyA_kjQ-CdASRkf50Glz3kQajlkD5qGWC4k", authDomain:"so-no-cc57a.firebaseapp.com",
    projectId:"so-no-cc57a", storageBucket:"so-no-cc57a.firebasestorage.app",
    messagingSenderId:"571694791559", appId:"1:571694791559:web:8e409728a520e2d370b122" };
  let app; try{ app = getApps().length ? getApp() : initializeApp(FB); }catch(e){ app = initializeApp(FB); }
  const auth = getAuth(app);
  const db   = getFirestore(app);

  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const gid = id => document.getElementById(id);
  const nid = ()=>[0,0,0].map(()=>Math.random().toString(36).slice(2,10)).join("");
  const linkCua = tk => location.origin + location.pathname + "?vt=" + tk;   // link ĐỊNH VỊ (khác ?ct tra cứu chuyến)
  const _vt = new URLSearchParams(location.search).get("vt");

  if(_vt){ driverGPS(_vt); return; }   // TRANG TÀI XẾ (định vị)
  ownerUI();                            // TRONG APP: nút tạo link

  /* ================= PHÍA CHỦ ================= */
  function ownerUI(){
    const st=document.createElement("style"); st.textContent=`
#hlFab{position:fixed;right:14px;bottom:calc(134px + env(safe-area-inset-bottom));z-index:46;display:none;align-items:center;gap:7px;background:#b085f5;color:#141414;border:0;padding:11px 15px;border-radius:30px;font:800 13px/1 system-ui,-apple-system,Roboto,sans-serif;box-shadow:0 5px 16px rgba(0,0,0,.45);cursor:pointer}

    document.head.appendChild(st);

    const fab=document.createElement("button"); fab.id="hlFab"; fab.type="button"; fab.textContent="🔗 Link định vị";
    document.body.appendChild(fab);

    const mask=document.createElement("div"); mask.id="hlMask";
    mask.innerHTML=`<div id="hlCard">
      <div class="h"><b>🔗 Link định vị cho tài xế</b><button class="x" id="hlClose" aria-label="Đóng">×</button></div>
      <div class="note">Gửi link của xe cho tài xế. Tài xế mở link, bấm <b>Chia sẻ vị trí</b> là xe hiện trên bản đồ của bạn — <b>không cần đăng nhập, không cần chuyến</b>. Link sống ${HAN_NGAY} ngày; “Thu hồi” để huỷ ngay.</div>
      <div id="hlList"><div class="empty">Đang tải xe…</div></div>
    </div>`;
    document.body.appendChild(mask);
    mask.addEventListener("click", e=>{ if(e.target===mask) dong(); });
    gid("hlClose").onclick=dong;

    let dsXe=[];
    async function taiXe(){
      const u=auth.currentUser; if(!u){ dsXe=[]; return; }
      try{ const s=await getDocs(collection(db,`users/${u.uid}/${KHO_XE}`));
        dsXe=s.docs.map(d=>({id:d.id, bienSo:d.data()[F_BIEN]||"(chưa biển)"})); }
      catch(e){ dsXe=[]; }
    }
    function veList(){
      const box=gid("hlList");
      if(!dsXe.length){ box.innerHTML=`<div class="empty">Chưa có xe nào. Thêm xe trong “Xe &amp; TX” trước.</div>`; return; }
      box.innerHTML=dsXe.map(v=>{
        const co=!!localStorage.getItem("hd_link_"+v.id);
        return `<div class="r" data-id="${esc(v.id)}" data-bien="${esc(v.bienSo)}">
          <div class="in"><span class="pl">${esc(v.bienSo)}</span></div>
          ${co?`<button class="rv">Thu hồi</button>`:``}
          <button class="cp">Sao chép link</button></div>`;
      }).join("");
      box.querySelectorAll(".r").forEach(r=>{
        const id=r.dataset.id, bien=r.dataset.bien;
        const cp=r.querySelector(".cp"); if(cp) cp.onclick=()=>taoLink(id,bien);
        const rv=r.querySelector(".rv"); if(rv) rv.onclick=()=>thuHoi(id);
      });
    }
    async function taoLink(vehId, bien){
      const u=auth.currentUser; if(!u){ bao("Bạn cần đăng nhập."); return; }
      let tk=localStorage.getItem("hd_link_"+vehId) || nid();
      try{
        await setDoc(doc(db, KHO_SHARE, tk), {
          ownerUid:u.uid, xeId:vehId, bienSo:bien||"", gpsOnly:true,
          hetHan:new Date(Date.now()+HAN_NGAY*DAY), taoLuc:new Date()
        });
        localStorage.setItem("hd_link_"+vehId, tk);
      }catch(e){ bao("Không tạo được link (kiểm tra mạng/hạn dùng)."); return; }
      const url=linkCua(tk); let ok=false;
      try{ await navigator.clipboard.writeText(url); ok=true; }catch(e){ ok=false; }
      if(ok) bao("Đã sao chép link xe "+(bien||"")+". Dán gửi cho tài xế.");
      else   hienLink(url);
      veList();
    }
    async function thuHoi(vehId){
      const tk=localStorage.getItem("hd_link_"+vehId); if(!tk) return;
      try{ await deleteDoc(doc(db, KHO_SHARE, tk)); }catch(e){}
      localStorage.removeItem("hd_link_"+vehId);
      bao("Đã thu hồi link. Link cũ không gửi vị trí được nữa."); veList();
    }
    function hienLink(url){
      const box=gid("hlList"); const d=document.createElement("div"); d.style.cssText="padding:10px 4px";
      d.innerHTML=`<div style="font-size:12px;color:#8b95a5;margin-bottom:6px">Sao chép thủ công:</div>
        <input readonly value="${esc(url)}" style="width:100%;box-sizing:border-box;padding:10px;border:1px solid #2c333d;border-radius:8px;font-size:12px;background:#12151a;color:#e9ecf1" onclick="this.select()">`;
      box.prepend(d);
    }
    function bao(t){
      let x=gid("hlToast"); if(!x){ x=document.createElement("div"); x.id="hlToast";
        x.style.cssText="position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:2147483600;background:#e9ecf1;color:#12151a;padding:11px 16px;border-radius:10px;font:700 13px system-ui;max-width:88%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.5)";
        document.body.appendChild(x); }
      x.textContent=t; x.style.opacity="1"; clearTimeout(x._t); x._t=setTimeout(()=>{ x.style.transition="opacity .4s"; x.style.opacity="0"; }, 2600);
    }
    async function mo(){ mask.classList.add("on"); document.body.style.overflow="hidden"; await taiXe(); veList(); }
    function dong(){ mask.classList.remove("on"); document.body.style.overflow=""; }
    fab.onclick=mo;

    // chỉ hiện nút khi đã đăng nhập & đang trong app (giống nút bản đồ)
    function sync(){ const nav=gid("nav"); const hien=nav&&getComputedStyle(nav).display!=="none"; fab.classList.toggle("on", !!(auth.currentUser&&hien)); }
    onAuthStateChanged(auth, u=>{ if(!u) dong(); sync(); });
    const navEl=gid("nav"); if(navEl) new MutationObserver(sync).observe(navEl,{attributes:true,attributeFilter:["style"]});
    sync();
  }

  /* ================= PHÍA TÀI XẾ (trang ?vt=token) ================= */
  async function driverGPS(token){
    document.body.style.overflow="hidden";
    const st=document.createElement("style"); st.textContent=`
#hlDrv{position:fixed;inset:0;z-index:2147483500;background:linear-gradient(160deg,#0b1220,#12151a 60%,#0b1220);color:#e9eef5;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}
#hlDrv .cap{font-size:13px;color:#8ea1b8;letter-spacing:.5px;text-transform:uppercase}
#hlDrv .pl{display:inline-block;background:#f5c518;color:#141414;font-weight:800;font-size:22px;padding:8px 16px;border-radius:10px;margin:12px 0 4px;letter-spacing:.5px}
#hlDrv .big{width:100%;max-width:340px;margin:26px 0 12px;background:#2563eb;border:0;border-radius:16px;padding:20px;color:#fff;font-weight:800;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 24px rgba(37,99,235,.4)}
#hlDrv .big.on{background:#e5484d;box-shadow:0 8px 24px rgba(229,72,77,.4)}
#hlDrv .big .dot{width:11px;height:11px;border-radius:50%;background:#fff;display:none}
#hlDrv .big.on .dot{display:inline-block;animation:hlBlink 1s infinite}
@keyframes hlBlink{50%{opacity:.2}}
#hlDrv .msg{font-size:13.5px;color:#aebccf;max-width:340px;line-height:1.55;min-height:20px}
#hlDrv .warn{margin-top:22px;font-size:12px;color:#7d8ea3;max-width:330px;line-height:1.5}
@media print{#hlDrv{display:none!important}}`;
    document.head.appendChild(st);

    const box=document.createElement("div"); box.id="hlDrv";
    box.innerHTML=`<div class="cap">Chia sẻ vị trí xe</div><div class="pl" id="hlPl">…</div><div id="hlSlot"></div>`;
    document.body.appendChild(box);
    const khong=t=>{ const s=gid("hlSlot"); if(s) s.innerHTML=`<div class="msg" style="color:#ff9a9a;margin-top:22px">${esc(t)}</div>`; };

    let g;
    try{ const s=await getDoc(doc(db, KHO_SHARE, token)); if(!s.exists()){ khong("Link không hợp lệ hoặc đã bị thu hồi."); return; } g=s.data(); }
    catch(e){ khong("Không mở được link (kiểm tra mạng)."); return; }

    const owner=g.ownerUid, vehId=g.xeId, bien=g.bienSo || (g.xe&&g.xe.bienSo) || "";
    gid("hlPl").textContent = bien || "(xe)";
    let hh=0; try{ hh=g.hetHan&&g.hetHan.toMillis?g.hetHan.toMillis():(g.hetHan&&g.hetHan.seconds?g.hetHan.seconds*1000:0); }catch(e){ hh=0; }
    if(hh && Date.now()>hh){ khong("Link đã hết hạn. Xin nhà xe gửi link mới."); return; }
    if(!owner || !vehId){ khong("Link thiếu thông tin xe. Nhà xe tạo lại link giúp."); return; }

    gid("hlSlot").innerHTML =
      `<button class="big" id="hlTog"><span class="dot"></span><span id="hlTogT">📍 Chia sẻ vị trí</span></button>`
      + `<div class="msg" id="hlMsg">Bấm để bắt đầu gửi vị trí xe về cho nhà xe.</div>`
      + `<div class="warn">Giữ trang này mở và để màn hình sáng thì vị trí mới gửi liên tục. Tắt màn hình hoặc đóng trang là dừng.</div>`;

    let wid=null, moc=null, wl=null;
    const setMsg=(t,bad)=>{ const m=gid("hlMsg"); if(m){ m.textContent=t; m.style.color=bad?"#ff9a9a":"#aebccf"; } };
    const setBtn=on=>{ const b=gid("hlTog"), t=gid("hlTogT"); if(b) b.classList.toggle("on",on); if(t) t.textContent=on?"■ Dừng chia sẻ":"📍 Chia sẻ vị trí"; };
    async function keep(){ try{ if("wakeLock" in navigator) wl=await navigator.wakeLock.request("screen"); }catch(e){} }
    function rel(){ try{ wl&&wl.release&&wl.release(); }catch(e){} wl=null; }
    function start(){
      if(!("geolocation" in navigator)) return setMsg("Thiết bị không hỗ trợ định vị.", true);
      if(!window.isSecureContext)       return setMsg("Cần mở link qua HTTPS mới định vị được.", true);
      moc=null;
      try{ wid=navigator.geolocation.watchPosition(onP,onE,{enableHighAccuracy:true,maximumAge:5000,timeout:20000}); }
      catch(e){ return setMsg("Không bật được định vị.", true); }
      setBtn(true); setMsg("Đang bật định vị… giữ trang mở & màn hình sáng."); keep();
    }
    function stop(){ if(wid!=null){ try{navigator.geolocation.clearWatch(wid);}catch(e){} } wid=null; moc=null; rel(); setBtn(false); setMsg("Đã dừng chia sẻ vị trí."); }
    function onP(p){
      const c=p.coords, now=Date.now();
      if(moc && (now-moc)<MIN_MS) return;
      moc=now;
      const rec={ xeId:vehId, bienSo:bien, lat:c.latitude, lng:c.longitude,
        acc:(c.accuracy==null?null:c.accuracy), spd:(c.speed==null?null:c.speed),
        heading:(c.heading==null?null:c.heading), at:new Date().toISOString(), by:"Tài xế (link)", token:token };
      setDoc(doc(db, "users", owner, KHO_VT, vehId), rec).catch(()=>{});
      setMsg(`Đang gửi vị trí về nhà xe · sai số ±${Math.round(c.accuracy||0)}m`);
    }
    function onE(e){
      if(e.code===1){ setMsg("Bạn đã từ chối quyền vị trí. Vào cài đặt trình duyệt để Cho phép rồi bật lại.", true); stop(); }
      else if(e.code===2) setMsg("Chưa bắt được GPS. Ra chỗ thoáng và bật Vị trí trên điện thoại.", true);
      else if(e.code===3) setMsg("Bắt GPS hơi lâu, đang thử lại…", true);
      else setMsg("Lỗi định vị.", true);
    }
    gid("hlTog").onclick=()=> (wid!=null ? stop() : start());
    document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible" && wid!=null && !wl) keep(); });
  }
})();
</script>
<!-- ═══ BĂNG NHẮC GIA HẠN (còn ≤3 ngày) ═══ -->
<script type="module">
(async () => {
  const MA_APP = 'hd';
  const NGAY_NHAC = 3;
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  try {
    const bases = ['10.12.0','10.12.5'].map(v => `https://www.gstatic.com/firebasejs/${v}`);
    const fas = await Promise.all(bases.map(b => import(`${b}/firebase-app.js`)));
    let idx = -1;
    for (let i = 0; i < 120 && idx < 0; i++) {
      idx = fas.findIndex(fa => fa.getApps().length > 0);
      if (idx < 0) await sleep(100);
    }
    if (idx < 0) return;
    const base = bases[idx], fa = fas[idx];
    const { getAuth, onAuthStateChanged } = await import(`${base}/firebase-auth.js`);
    const { getFirestore, doc, getDoc }   = await import(`${base}/firebase-firestore.js`);
    const app = fa.getApp(), auth = getAuth(app), fdb = getFirestore(app);

    onAuthStateChanged(auth, async (u) => {
      if (!u) return;
      try {
        const snap = await getDoc(doc(fdb, `accounts/${u.uid}/lic/${MA_APP}`));
        if (!snap.exists()) return;
        const d = snap.data();
        if (d.active === false || d.vinhVien === true || !d.paidUntil) return;
        const until = d.paidUntil.toDate ? d.paidUntil.toDate() : new Date(d.paidUntil);
        if (isNaN(until)) return;
        const conLai = Math.ceil((until.getTime() - Date.now()) / 86400000);
        if (conLai < 1 || conLai > NGAY_NHAC) return;
        hienBang(conLai, until);
      } catch (e) {}
    });

    function hienBang(conLai, until) {
      if (document.getElementById('nhac-gia-han')) return;
      const ng = `${String(until.getDate()).padStart(2,'0')}/${String(until.getMonth()+1).padStart(2,'0')}/${until.getFullYear()}`;
      const w = document.createElement('div');
      w.id = 'nhac-gia-han';
      w.style.cssText = 'position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:99999;max-width:92vw;width:420px;box-sizing:border-box;background:#fff;border:1px solid #f0c36d;border-left:5px solid #e0912f;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,.18);padding:13px 14px;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;gap:10px;align-items:flex-start';
      w.innerHTML =
        '<div style="font-size:22px;line-height:1">⏳</div>' +
        '<div style="flex:1;min-width:0">' +
          '<div style="font-weight:800;font-size:15px;color:#b56a12">Phần mềm sắp hết hạn</div>' +
          '<div style="font-size:13.5px;color:#444;margin-top:2px">Còn <b>' + conLai + ' ngày</b> (hết hạn ' + ng + '). Gia hạn sớm để dùng liên tục.</div>' +
          '<div style="margin-top:10px;display:flex;gap:8px">' +
            '<button id="nhac-go" style="border:none;border-radius:9px;padding:8px 14px;font-weight:800;font-size:13.5px;cursor:pointer;background:#e0912f;color:#fff">💳 Gia hạn ngay</button>' +
            '<button id="nhac-x" style="border:none;border-radius:9px;padding:8px 12px;font-size:13.5px;cursor:pointer;background:#eee;color:#555">Để sau</button>' +
          '</div>' +
        '</div>';
      document.body.appendChild(w);
      document.getElementById('nhac-x').onclick = () => w.remove();
      document.getElementById('nhac-go').onclick = () => {
        w.remove();
        if (typeof window.openRenew === 'function') window.openRenew();
        else if (typeof window.congGiaHan === 'function') window.congGiaHan();
      };
    }
  } catch (e) {}
})();
</script>
